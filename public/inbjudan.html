<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Din inbjudan</title>
<link rel="stylesheet" href="/inbjudan.css">
<script src="/inbjudan.js" defer></script>
</head>
<body>
<main>
  <section class="card" aria-labelledby="heading">
    <p class="eyebrow">Personlig inbjudan</p>
    <h1 id="heading">Välkommen!</h1>
    <p id="status" role="status">Kontrollerar inbjudan …</p>
    <div id="details" hidden>
      <p>Du är inbjuden till <strong id="group"></strong>.</p>
      <p>Inbjudan gäller e-postadressen <strong id="email"></strong>.</p>
      <p class="note">Nästa steg blir att verifiera e-postadressen och bekräfta medlemskapet. Detta är ännu en testsida. Du har inte blivit medlem.</p>
      <button type="button" disabled>Bekräfta medlemskap (kommer senare)</button>
    </div>
  </section>
</main>
</body>
</html>
